base:
- base/fcn.yaml
parser:
  nodes:
  - null
  - - /model.17/classifier/classifier.1/Conv
  normalization_params:
    normalize_in_net: true
    std_list:
    - 255.0
    - 255.0
    - 255.0
    mean_list:
    - 0.0
    - 0.0
    - 0.0
postprocessing:
  device_pre_post_layers:
    softmax: false
    argmax: false
    bilinear: false
    nms: false
info:
  task: semantic segmentation
  input_shape: 1024x2048x3
  output_shape: 1024x2048x1
  framework: pytorch
  training_data: cityscapes train
  validation_data: cityscapes val
  eval_metric: mIoU
  source: https://github.com/ultralytics/ultralytics
  license_url: https://github.com/ultralytics/ultralytics/blob/main/LICENSE
  license_name: AGPL-3.0
