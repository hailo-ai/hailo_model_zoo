base:
- base/fcn.yaml
inference:
  full_precision_batch_size: 1
  emulator_batch_size: 1
parser:
  nodes:
  - null
  - null
  normalization_params:
    normalize_in_net: true
    std_list:
    - 127.5
    - 127.5
    - 127.5
    mean_list:
    - 127.5
    - 127.5
    - 127.5
info:
  task: semantic segmentation
  input_shape: 1024x2048x3
  output_shape: 1024x2048x1
  framework: paddlepaddle
  training_data: cityscapes train
  validation_data: cityscapes val
  eval_metric: mIoU
  source: https://github.com/PaddlePaddle/PaddleSeg/tree/release/2.9/configs/pp_liteseg
  license_url: https://github.com/PaddlePaddle/PaddleSeg/blob/release/2.9/LICENSE
  license_name: Apache-2.0
