base:
- base/fcn.yaml
inference:
  full_precision_batch_size: 1
  emulator_batch_size: 1
parser:
  nodes:
  - null
  - null
postprocessing:
  device_pre_post_layers:
    argmax: false
    bilinear: false
  align_corners: true
info:
  task: semantic segmentation
  input_shape: 1024x2048x3
  output_shape: 1024x2048x1
  framework: pytorch
  training_data: cityscapes train
  validation_data: cityscapes val
  eval_metric: mIoU
  source: https://github.com/XuJiacong/PIDNet
  license_url: https://github.com/XuJiacong/PIDNet/blob/main/LICENSE
  license_name: MIT
